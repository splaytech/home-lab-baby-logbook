version: '3.8'

services:
  baby-logbook:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: baby-logbook
    image: baby-logbook:latest

    ports:
      - "${PORT:-3000}:3000"

    environment:
      - NODE_ENV=${NODE_ENV:-production}
      - PORT=3000
      - TZ=${TZ:-Australia/Melbourne}
      - DATABASE_PATH=/data/baby-logbook.db
      - SESSION_SECRET=${SESSION_SECRET}
      - BACKUP_RETENTION_DAYS=${BACKUP_RETENTION_DAYS:-30}
      - SMTP_ENABLED=${SMTP_ENABLED:-false}
      - SMTP_HOST=${SMTP_HOST:-}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_USER=${SMTP_USER:-}
      - SMTP_PASS=${SMTP_PASS:-}
      - SMTP_FROM=${SMTP_FROM:-}

    volumes:
      - ./data:/data
      - ./backups:/backups
      - ./config:/config

    restart: unless-stopped

    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/health', (r) => process.exit(r.statusCode === 200 ? 0 : 1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

    networks:
      - baby-logbook-network

networks:
  baby-logbook-network:
    driver: bridge

volumes:
  data:
  backups:
  config:
